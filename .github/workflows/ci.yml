name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          # `.nvmrc` and the `engines` field in package.json both require 24.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # The lockfile is committed and CI must never resolve versions itself.
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Typecheck
        # Biome does not validate types and the tests do not either: a file
        # that fails to compile still runs. This is the step that catches it,
        # which is why one merged without it.
        run: pnpm exec tsc -b

      - name: Test
        # CI is set so Vitest runs once instead of watching.
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7